name: openmuse
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      browser-worker:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      PUBLIC_API_URL: https://muse.beenex.cloud
      ALLOWED_ORIGINS: https://muse.beenex.cloud
      WORKSPACE_MODE: sample
      AGENT_BACKEND: model
      MODEL: ${MODEL:-openai/@cf/deepseek-ai/deepseek-v4-pro-0813}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-placeholder}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.cloudflare.com/client/v4/accounts/placeholder/ai/v1}
      BROWSER_WORKER_URL: http://browser-worker:8790
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN to a random secret of at least 32 characters}
      COMPUTER_ENABLED: "true"
      COMPUTER_IMAGE: openmuse-computer:local
      DATA_DIR: /app/.openmuse
      TASK_WORKER_ENABLED: "true"
    ports:
      - "8787:8787"
    volumes:
      - openmuse-data:/app/.openmuse
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  browser-worker:
    build:
      context: ../apps/worker
    init: true
    restart: unless-stopped
    environment:
      WORKER_HOST: 0.0.0.0
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN to a random secret of at least 32 characters}
    volumes:
      - browser-profiles:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256mb
    mem_limit: 2g
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  openmuse-data:
  browser-profiles:
